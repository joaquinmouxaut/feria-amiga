<div class="fixed inset-0 bg-gray-800 bg-opacity-50 flex justify-center items-center z-50">
  <div class="bg-white rounded-lg shadow-lg w-11/12 max-w-2xl">
    <div class="p-4 flex justify-between items-center border-b">
      <h2 class="text-xl font-bold">{{ businessData.title }}</h2>
      <button (click)="close()" class="text-gray-500 hover:text-red-500">Cerrar</button>
    </div>

    <div class="carousel-container">
      @if (currentProduct && currentProduct.img ) {
        <div class="carousel">
            <div 
              class="carousel-image active"
            >
              <img [src]="currentProduct.img"/>
            </div>
        </div>
      }
    
      <div class="thumbnails">
        @for (product of businessData.products; track product) {
          <img 
            [src]="product.img"
            [class.active-thumbnail]="product === currentProduct"
            (click)="selectProduct(product)"
          />
        }
      </div>
    </div>
  </div>
</div>
