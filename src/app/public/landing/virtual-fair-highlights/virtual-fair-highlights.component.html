<h1
  class="font-black text-xl sm:text-5xl w-fit mx-auto px-6 sm:px-8 py-1 rounded-md border-[3px] border-black uppercase"
>
  Emprendedores
</h1>

<div class="mt-5 flex justify-between gap-4">
  @for ( category of categories; track category) {
    <div class="w-fit mx-auto">
      <div class="w-16 h-16 p-3 rounded-full mx-auto" [ngStyle]="{'background-color': category.backgroundColor}">
        <img
        src="{{ category.image }}"
        alt="flor_cocina"
        class="w-full h-full object-contain"
        loading="lazy"
        />
      </div>
      <h2 class="text-xs font-bold mt-2 text-center font-tertiary uppercase">
        {{ category.title }}
      </h2>
    </div>
  }  
</div>

<div class="mx-auto mt-4 w-fit">
  <button class="cursor-pointer">
    <a routerLink="/feria-virtual" class="px-3 py-1 rounded-lg uppercase text-center text-sm font-semibold bg-naranja text-white tracking-[1px] uppercase">Ver más</a>  
  </button>
</div>
